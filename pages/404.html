<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <title>WebVividDreams</title>

  <script>
    // Store the URL the user was trying to access when receiving the 404.
    sessionStorage.setItem('redirect', location.href);
    // Send the user to the app of the locale in the URL, so its router can
    // restore the stored URL. Unknown locales fall back to the root redirect.
    var match = location.pathname.match(/^\/web-vivid-dreams\/(en|hu)(\/|$)/);
    location.replace(match ? '/web-vivid-dreams/' + match[1] + '/' : '/web-vivid-dreams/');
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0;URL='/web-vivid-dreams/'"/>
  </noscript>
</head>

<body>

</html>
