<button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Language">
  <mat-icon>language</mat-icon>
</button>
<mat-menu #menu>
  @for (item of languages; track item) {
    <a href="{{item.url}}">
      <button mat-menu-item>
        <span>{{item.text}}</span>
      </button>
    </a>
  }
</mat-menu>
